<style>
svg{--surface:#ffffff;--ink:#1b2430;--ink-dim:#5b6675;--ink-faint:#8892a0;--border:#d7dde4;
--border-strong:#b9c2cc;--accent:#2f6f6a;--accent-soft:#e2efed;--head-right:#2f5fa8;
--head-left:#8a3fa0;--root:#b3261e;}
.bg{fill:var(--surface);}
.form{font:600 13px "IBM Plex Sans","Segoe UI",Arial,sans-serif;fill:var(--ink);}
.lemma{font:italic 11px "IBM Plex Sans","Segoe UI",Arial,sans-serif;fill:var(--ink-dim);}
.upos{font:600 10.5px "IBM Plex Mono",Consolas,monospace;fill:var(--accent);}
.feats{font:9.5px "IBM Plex Mono",Consolas,monospace;fill:var(--ink-dim);}
.idlabel{font:9.5px "IBM Plex Mono",Consolas,monospace;fill:var(--ink-faint);}
.deprel{font:10.5px "IBM Plex Mono",Consolas,monospace;}
.deprel.right{fill:var(--head-right);}
.deprel.left{fill:var(--head-left);}
.deprel.out{fill:var(--ink-faint);}
.deprel-bg{fill:var(--surface);opacity:0.86;}
.edge{fill:none;stroke-width:1.3;}
.edge.right{stroke:var(--head-right);}
.edge.left{stroke:var(--head-left);}
.edge.out{stroke:var(--ink-faint);stroke-dasharray:3,3;}
.ah.right{fill:var(--head-right);}
.ah.left{fill:var(--head-left);}
.ah.root{fill:var(--root);}
.ah.out{fill:var(--ink-faint);}
.rootline{fill:none;stroke:var(--root);stroke-width:1.4;}
.rootlabel{font:600 10px "IBM Plex Mono",Consolas,monospace;fill:var(--root);}
.connector{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:2,3;}
.nodebox{fill:var(--surface);stroke:var(--border-strong);stroke-width:1;}
.nodebox.hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;}
.gap{font:13px "IBM Plex Sans","Segoe UI",Arial,sans-serif;fill:var(--ink-faint);}
</style>
